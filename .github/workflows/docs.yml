# Documentation CI.
#   Pull requests:     strict build + wikilink check only (same as tools/docs/smoke_test.ps1).
#                      A broken link, invalid frontmatter or a leaked [[wikilink]] turns the check red.
#   Merged to master:  the same check, then publish to GitHub Pages:
#                      https://tue-robotics.github.io/humanoid_BoosterT1/
# Nothing unreviewed is published: only what is merged into master goes live.
name: docs

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch: # manual re-publish from the Actions tab

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the page "last updated" dates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/docs/requirements.txt
      - run: pip install -r tools/docs/requirements.txt
      - name: Build (strict)
        run: mkdocs build --strict
      - name: No unconverted wikilinks in the output
        run: python tools/docs/check_wikilink_leak.py
      - name: Hand the built site to the deploy job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
