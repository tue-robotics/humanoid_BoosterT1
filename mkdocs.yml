site_name: Booster T1 Documentation for Tech United @Home
site_url: https://tue-robotics.github.io/humanoid_BoosterT1/
repo_url: https://github.com/tue-robotics
repo_name: tue-robotics
strict: !ENV [DOCS_STRICT, true]   # set DOCS_STRICT=false only for a local preview while editing

theme:
  name: material
  features:
    - navigation.tabs        # top-level sections as a horizontal bar
    - navigation.indexes
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

# NOTE: Material for MkDocs is in maintenance mode until 2027-05-05.
# Keep the plugin stack minimal and replaceable; prefer plain Markdown
# so the content survives a switch of site generator.
plugins:
  - search
  - callouts
  - git-revision-date-localized:
      # Disabled by tools/docs/smoke_test.ps1 only until docs/ is tracked by git.
      enabled: !ENV [DOCS_GIT_DATES, true]
      enable_creation_date: true
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Our own hooks, not plugins:
#   autonav.py   - menu and page titles generated from the docs/ folders (no nav list to maintain)
#   wikilinks.py - Obsidian [[page#Heading|alias]] links converted to normal links
hooks:
  - tools/docs/hooks/autonav.py
  - tools/docs/hooks/wikilinks.py

# Only systematic, proven, human-reviewed pages belong in docs/;
# drafts live in the private notebook (l1-drafts/) until reviewed and merged by PR.
